# Templates only: not part of kustomization.yaml and never applied by it. Copy, fill in real values and create the
# secrets out of band (sealed-secrets, external-secrets, `kubectl create secret`). Every secret is optional in the
# Deployment, so a cluster can start with any subset. The same cases as JSON live in examples/authentication/.
#
# Authentication is split like the code: Authentication__Jwt__* (SSO, partner JWTs), Authentication__ApiKeys__* and
# Authentication__Signature__* (partners that sign each request with RSA). JWT is only required when neither an API key
# nor a signature flow is enabled.
# Environment variable names use "__" where the JSON path uses ":" and a numeric suffix for array items.

# Case 1, single identity provider: used only while Authentication__Jwt__Providers__* is empty.
apiVersion: v1
kind: Secret
metadata:
  name: core-gateway-auth
type: Opaque
stringData:
  authority: https://sso.example.com/realms/main
  audience: gateway-api
---
# Cases 2-5, JWT providers (any mix). Exactly one of Authority, SigningKey or PublicKeyFile per provider.
# As soon as one provider exists the single-IdP Authority/Audience above is ignored.
apiVersion: v1
kind: Secret
metadata:
  name: core-gateway-jwt-providers
type: Opaque
stringData:
  # Case 2, SSO: keys come from the OIDC discovery document, so they rotate without a redeploy.
  Authentication__Jwt__Providers__SSO__Issuer: https://sso.example.com/realms/main
  Authentication__Jwt__Providers__SSO__Authority: https://sso.example.com/realms/main
  Authentication__Jwt__Providers__SSO__Audience: gateway-api
  Authentication__Jwt__Providers__SSO__ValidAlgorithms__0: RS256
  Authentication__Jwt__Providers__SSO__RoleClaimType: roles

  # Case 3, partner signing JWTs with a shared secret (HS*): at least 32 bytes for HS256, 48 for HS384, 64 for HS512.
  Authentication__Jwt__Providers__PartnerHmac__Issuer: https://partner-hmac.example.com
  Authentication__Jwt__Providers__PartnerHmac__Audience: gateway-api
  Authentication__Jwt__Providers__PartnerHmac__SigningKey: replace-with-a-random-secret-of-at-least-32-bytes
  Authentication__Jwt__Providers__PartnerHmac__ValidAlgorithms__0: HS256

  # Case 4a, partner with an RSA public key published as JWKS (several keys, selected by "kid").
  Authentication__Jwt__Providers__PartnerRsa__Issuer: https://partner-rsa.example.com
  Authentication__Jwt__Providers__PartnerRsa__Audience: gateway-api
  Authentication__Jwt__Providers__PartnerRsa__PublicKeyFile: /app/keys/partner-rsa.jwks
  Authentication__Jwt__Providers__PartnerRsa__ValidAlgorithms__0: RS256

  # Case 4b, partner with an EC public key in PEM (ES256 for P-256, ES384 for P-384, ES512 for P-521).
  Authentication__Jwt__Providers__PartnerEc__Issuer: https://partner-ec.example.com
  Authentication__Jwt__Providers__PartnerEc__Audience: gateway-api
  Authentication__Jwt__Providers__PartnerEc__PublicKeyFile: /app/keys/partner-ec.pem
  Authentication__Jwt__Providers__PartnerEc__ValidAlgorithms__0: ES256

  # Case 4c, partner that hands out an X.509 certificate: only its public key is used (validity is not checked).
  Authentication__Jwt__Providers__PartnerCertificate__Issuer: https://partner-cert.example.com
  Authentication__Jwt__Providers__PartnerCertificate__Audience: gateway-api
  Authentication__Jwt__Providers__PartnerCertificate__PublicKeyFile: /app/keys/partner-cert.pem
  Authentication__Jwt__Providers__PartnerCertificate__ValidAlgorithms__0: PS256

  # Temporarily switch one provider off without deleting its settings.
  # Authentication__Jwt__Providers__PartnerHmac__Enabled: "false"
---
# Public keys (JWKS, or PEM: PUBLIC KEY, RSA PUBLIC KEY, CERTIFICATE) for JWT providers and signature clients,
# mounted read-only at /app/keys.
# Read once at startup: change a key, then roll the pods. Put old and new keys in one JWKS to rotate without downtime.
apiVersion: v1
kind: Secret
metadata:
  name: core-gateway-keys
type: Opaque
stringData:
  partner-rsa.jwks: |
    {"keys":[{"kty":"RSA","kid":"2026-01","use":"sig","n":"<base64url modulus>","e":"AQAB"}]}
  partner-ec.pem: |
    -----BEGIN PUBLIC KEY-----
    <base64 SubjectPublicKeyInfo>
    -----END PUBLIC KEY-----
  partner-cert.pem: |
    -----BEGIN CERTIFICATE-----
    <base64 certificate>
    -----END CERTIFICATE-----
  signature-partner-a.pem: |
    -----BEGIN PUBLIC KEY-----
    <base64 SubjectPublicKeyInfo of partner-a's RSA key>
    -----END PUBLIC KEY-----
---
# Case 6, partners that sign every request with their RSA private key; the gateway only holds the public key.
apiVersion: v1
kind: Secret
metadata:
  name: core-gateway-signature
type: Opaque
stringData:
  Authentication__Signature__Enabled: "true"
  Authentication__Signature__Algorithm: RS256
  Authentication__Signature__MaxClockSkewSeconds: "300"
  Authentication__Signature__MaxBodyBytes: "131072"
  Authentication__Signature__RejectReplays: "true"
  Authentication__Signature__Clients__partner-a__PublicKeyFile: /app/keys/signature-partner-a.pem
  Authentication__Signature__Clients__partner-a__Scopes__0: orders.read
  Authentication__Signature__Clients__partner-a__Roles__0: partner
  Authentication__Signature__Clients__partner-a__TenantId: t1
  # Authentication__Signature__Clients__partner-a__Enabled: "false"   # revoke without deleting
---
# Case 5, machine clients: only the SHA-256 of each key is stored (printf %s "$key" | sha256sum | cut -d' ' -f1).
# To revoke a client set Enabled to "false"; to rotate, add a new client first, move the caller, then disable the old one.
apiVersion: v1
kind: Secret
metadata:
  name: core-gateway-api-keys
type: Opaque
stringData:
  Authentication__ApiKeys__Enabled: "true"
  Authentication__ApiKeys__HeaderName: X-Api-Key
  Authentication__ApiKeys__Clients__billing-service__KeyHash: "<sha256 hex>"
  Authentication__ApiKeys__Clients__billing-service__Scopes__0: orders.read
  Authentication__ApiKeys__Clients__billing-service__Scopes__1: orders.write
  Authentication__ApiKeys__Clients__billing-service__Roles__0: service
  Authentication__ApiKeys__Clients__billing-service__TenantId: t1
  Authentication__ApiKeys__Clients__retired-client__Enabled: "false"
  Authentication__ApiKeys__Clients__retired-client__KeyHash: "<sha256 hex>"
