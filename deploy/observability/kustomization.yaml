# Optional monitoring add-on; needs the Prometheus Operator CRDs and a Grafana dashboard sidecar
# (kube-prometheus-stack defaults). Apply with: kubectl apply -k deploy/observability
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - prometheus-rules.yaml

configMapGenerator:
  - name: core-gateway-dashboard
    files:
      - grafana-dashboard.json
    options:
      labels:
        grafana_dashboard: "1"

generatorOptions:
  disableNameSuffixHash: true
