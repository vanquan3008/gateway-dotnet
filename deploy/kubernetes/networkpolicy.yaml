apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: core-gateway-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: core-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - port: 8080
          protocol: TCP
