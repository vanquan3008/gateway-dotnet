apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - pdb.yaml
  - hpa.yaml
  - ingress.yaml
  - networkpolicy.yaml

configMapGenerator:
  - name: core-gateway-routes
    files:
      - reverseproxy.json
  - name: core-gateway-settings
    envs:
      - settings.env

generatorOptions:
  immutable: true
  labels:
    app.kubernetes.io/name: core-gateway

replacements:
  - source:
      kind: ConfigMap
      name: core-gateway-settings
      fieldPath: data.GatewaySecurity__AllowedHosts__0
    targets:
      - select:
          kind: Deployment
          name: core-gateway
        fieldPaths:
          - spec.template.spec.containers.[name=gateway].startupProbe.httpGet.httpHeaders.[name=Host].value
          - spec.template.spec.containers.[name=gateway].livenessProbe.httpGet.httpHeaders.[name=Host].value
          - spec.template.spec.containers.[name=gateway].readinessProbe.httpGet.httpHeaders.[name=Host].value
      - select:
          kind: Ingress
          name: core-gateway
        fieldPaths:
          - spec.rules.0.host
          - spec.tls.0.hosts.0
