name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build:
    name: Build .NET 10
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      GATEWAY_TEST_REDIS: 127.0.0.1:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Core.Gateway.sln

      - name: Verify format
        run: dotnet format Core.Gateway.sln --verify-no-changes --no-restore --verbosity minimal

      - name: Build
        run: dotnet build Core.Gateway.sln --configuration Release --no-restore --nologo

      - name: Test
        run: dotnet test Core.Gateway.sln --configuration Release --no-build --no-restore --nologo

      - name: Smoke test development APIs and gateway
        shell: pwsh
        run: ./tests/smoke-development.ps1
